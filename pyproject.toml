[project]
name = "ods-phenocontext"
version = "0.1.0"
description = "Rules-first, BioBERT-fallback phenotype context classifier for clinical NLP"
authors = [
    { name = "Grannis, Connor", email = "connor.grannis@nationwidechildrens.org" }
]
requires-python = ">=3.11,<3.12"
dependencies = [
    "accelerate>=1.13.0",
    "click>=8.3.3",
    "huggingface-hub>=1.14.0",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "safetensors>=0.7.0",
    "scikit-learn>=1.8.0",
    "sentencepiece>=0.2.1",
    "tokenizers>=0.22.2",
    "torch>=2.6",
    "tqdm>=4.67.3",
    "transformers>=5.8.0",
]

[project.optional-dependencies]
rules = [
    "spacy>=3.8.14",
]

# Cross-platform torch: PyPI (MPS-capable) on macOS; CUDA 12.4 wheel index on Linux.
# Minimum 2.6 required — transformers 5.x blocks torch.load on <2.6 (CVE-2025-32434).
# The marker is evaluated at lock time per platform so both are in the lockfile.
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu124", marker = "sys_platform == 'linux'" },
]

# Ensure the lockfile is pre-resolved for both dev (macOS ARM64) and the
# deployment target (Linux x86_64).  Without this, running uv on macOS
# produces a lockfile with no Linux torch wheel, breaking the Docker build.
[tool.uv]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipython>=9.13.0",
    "mypy>=2.0.0",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.12",
]
teacher = [
    "boto3>=1.43.5",
    "langchain>=1.2.17",
    "langchain-aws>=1.4.6",
    "langchain-core>=1.3.3",
    "python-dotenv>=1.2.2",
    "tenacity>=9.1.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/F: pycodestyle/pyflakes, I: isort, B: bugbear, UP: pyupgrade, SIM: simplify
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict_optional = true
# HF/torch stubs are incomplete; suppress missing-import noise
ignore_missing_imports = true
