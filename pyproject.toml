[project]
name = "ods-phenocontext"
version = "0.1.0"
description = "Rules-first, BioBERT-fallback phenotype context classifier for clinical NLP"
authors = [
    { name = "Grannis, Connor", email = "connor.grannis@nationwidechildrens.org" }
]
requires-python = ">=3.11,<3.12"
dependencies = [
    "accelerate>=1.13.0",
    "click>=8.3.3",
    "huggingface-hub>=1.14.0",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "safetensors>=0.7.0",
    "scikit-learn>=1.8.0",
    "sentencepiece>=0.2.1",
    "tokenizers>=0.22.2",
    "torch>=2.4,<2.6",
    "tqdm>=4.67.3",
    "transformers>=5.8.0",
]

# Cross-platform torch: PyPI (MPS-capable) on macOS; CUDA 12.4 wheel index on Linux.
# The marker is evaluated at lock time per platform so both are in the lockfile.
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu124", marker = "sys_platform == 'linux'" },
]

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"
